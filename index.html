<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriVision AI — Enterprise Smart Agriculture Command Center</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            950: '#020617',
                            900: '#0b1329',
                            800: '#111e38',
                            700: '#1e293b',
                            emerald: '#10b981',
                            cyan: '#06b6d4',
                            amber: '#f59e0b',
                            rose: '#f43f5e'
                        }
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 2s infinite',
                        'radar-sweep': 'radarSweep 4s linear infinite',
                        'scanline': 'scanline 8s linear infinite'
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { opacity: 0.8, filter: 'drop-shadow(0 0 12px rgba(16,185,129,0.6))' },
                            '50%': { opacity: 0.4, filter: 'drop-shadow(0 0 4px rgba(16,185,129,0.2))' }
                        },
                        radarSweep: {
                            '0%': { transform: 'rotate(0deg)' },
                            '100%': { transform: 'rotate(360deg)' }
                        },
                        scanline: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(1000%)' }
                        }
                    }
                }
            }
        }
    </script>

    <!-- React, ReactDOM & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #020617;
        }

        .font-mono-tech {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Glassmorphic Cyber Panels */
        .cyber-glass {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.85) 0%, rgba(2, 6, 23, 0.95) 100%);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(30, 41, 59, 0.7);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .cyber-glass-active {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(6, 182, 212, 0.05) 100%);
            border: 1px solid rgba(16, 185, 129, 0.4);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.15);
        }

        /* Custom Cyber Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #020617;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 3px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #10b981;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-black">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            // Navigation State
            const [activeTab, setActiveTab] = useState('telemetry');

            // Clock & Time State
            const [time, setTime] = useState(new Date());

            // Emergency Stop & Alert States
            const [emergencyHalt, setEmergencyHalt] = useState(false);
            const [showEStopModal, setShowEStopModal] = useState(false);

            // Weather State
            const [weather, setWeather] = useState(null);
            const [weatherLoading, setWeatherLoading] = useState(true);

            // Actuator Controls State
            const [actuators, setActuators] = useState({
                irrigationValve01: true,
                irrigationValve02: true,
                irrigationValve03: false,
                thermalFogger: false,
                solarTrackers: true,
                ozoneGenerators: true
            });

            // AI Search Advisor State
            const [searchQuery, setSearchQuery] = useState('');
            const [searchLoading, setSearchLoading] = useState(false);
            const [searchResult, setSearchResult] = useState(null);

            // Selected Map Zone State
            const [selectedZone, setSelectedZone] = useState('Zone-A');

            // Automation Rules State
            const [rules, setRules] = useState([
                { id: 1, name: 'Moisture Auto-Irrigate', condition: 'Soil Moisture < 35%', action: 'Open Valve 01 & 02 for 15 mins', active: true },
                { id: 2, name: 'Heat Stress Prevention', condition: 'Air Temp > 38°C', action: 'Activate Thermal Fogger Array', active: true },
                { id: 3, name: 'Night Frost Shield', condition: 'Soil Temp < 10°C', action: 'Enable Under-bed Thermal Mats', active: false }
            ]);

            // OpenWeather Fetch
            const OPENWEATHER_KEY = '1bd24c09f5d8675f2e77a3366efb85f4';

            useEffect(() => {
                // Initialize Lucide Icons
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                setWeatherLoading(true);
                fetch(`https://api.openweathermap.org/data/2.5/weather?q=Chennai&units=metric&appid=${OPENWEATHER_KEY}`)
                    .then(res => res.json())
                    .then(data => {
                        setWeather(data);
                        setWeatherLoading(false);
                    })
                    .catch(err => {
                        console.error('Weather fetch error:', err);
                        setWeatherLoading(false);
                    });
            }, []);

            // E-Stop Handler
            const confirmEmergencyStop = () => {
                setEmergencyHalt(true);
                setShowEStopModal(false);
                setActuators({
                    irrigationValve01: false,
                    irrigationValve02: false,
                    irrigationValve03: false,
                    thermalFogger: false,
                    solarTrackers: false,
                    ozoneGenerators: false
                });
            };

            const resetEmergencyStop = () => {
                setEmergencyHalt(false);
            };

            // Keyless Wikipedia Search Handler
            const handleSearchSubmit = async (e) => {
                e.preventDefault();
                if (!searchQuery.trim()) return;
                setSearchLoading(true);
                setSearchResult(null);

                try {
                    // Step 1: Search Wikipedia API
                    const searchUrl = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(searchQuery + " agriculture farming")}&format=json&origin=*`;
                    const res = await fetch(searchUrl);
                    const data = await res.json();

                    if (data.query?.search?.length > 0) {
                        const topMatch = data.query.search[0];
                        const title = topMatch.title;

                        // Step 2: Get Summary REST API
                        const summaryRes = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
                        if (summaryRes.ok) {
                            const summaryData = await summaryRes.json();
                            setSearchResult({
                                title: summaryData.title,
                                description: summaryData.description || 'Agricultural Science Analysis',
                                extract: summaryData.extract,
                                thumbnail: summaryData.thumbnail?.source || null,
                                pageUrl: summaryData.content_urls?.desktop?.page || `https://en.wikipedia.org/wiki/${encodeURIComponent(title)}`
                            });
                        }
                    } else {
                        setSearchResult({
                            title: 'No Direct Match Found',
                            extract: `No specific telemetry entry found for "${searchQuery}". Try searching topics like "Drip Irrigation", "Photosynthesis", "Nitrogen Cycle", or "Drone Multispectral Imaging".`,
                            pageUrl: `https://duckduckgo.com/?q=${encodeURIComponent(searchQuery + " agriculture")}`
                        });
                    }
                } catch (error) {
                    console.error('Search failed:', error);
                    setSearchResult({
                        title: 'Knowledge Base Fetch Notice',
                        extract: `Query processed with fallback telemetry. Review domain parameters or launch external DuckDuckGo/Google search handlers below.`,
                        pageUrl: `https://duckduckgo.com/?q=${encodeURIComponent(searchQuery + " agriculture")}`
                    });
                } finally {
                    setSearchLoading(false);
                }
            };

            // Toggle Actuator Handler
            const toggleActuator = (key) => {
                if (emergencyHalt) return;
                setActuators(prev => ({ ...prev, [key]: !prev[key] }));
            };

            return (
                <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100 font-sans selection:bg-emerald-500 selection:text-slate-950">
                    
                    {/* E-STOP EMERGENCY OVERLAY WARNING */}
                    {emergencyHalt && (
                        <div className="bg-rose-950/90 border-b border-rose-500/50 px-6 py-3 flex items-center justify-between text-xs font-mono-tech sticky top-0 z-50 animate-pulse">
                            <div className="flex items-center space-x-3 text-rose-200">
                                <span className="p-1 bg-rose-600 text-white font-bold rounded">EMERGENCY HALT</span>
                                <span className="font-semibold">CRITICAL SYSTEM SHUTDOWN ACTIVE — ALL ACTUATORS LOCKED IN SAFE POSITION</span>
                            </div>
                            <button 
                                onClick={resetEmergencyStop}
                                className="px-3 py-1 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded text-xs transition border border-rose-400"
                            >
                                OVERRIDE & RESET SYSTEM
                            </button>
                        </div>
                    )}

                    {/* TOP COMMAND BAR HEADER */}
                    <header className="border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-xl sticky top-0 z-40 px-6 py-3.5 flex flex-wrap items-center justify-between gap-4">
                        <div className="flex items-center space-x-4">
                            <div className="relative flex items-center justify-center w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500/20 to-cyan-500/20 border border-emerald-500/40 text-emerald-400 shadow-lg shadow-emerald-950/50">
                                <i data-lucide="cpu" className="w-5 h-5"></i>
                                <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-emerald-400 rounded-full animate-ping"></span>
                            </div>
                            <div>
                                <div className="flex items-center space-x-2">
                                    <h1 className="text-lg font-black tracking-tight bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400 bg-clip-text text-transparent">
                                        AGRIVISION AI
                                    </h1>
                                    <span className="text-[10px] font-mono-tech font-bold px-1.5 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                        v4.8 PRO
                                    </span>
                                </div>
                                <p className="text-[11px] text-slate-400 font-mono-tech">Autonomous Agriculture Command Hub</p>
                            </div>
                        </div>

                        {/* System Status Indicators & Clocks */}
                        <div className="flex flex-wrap items-center space-x-6 text-xs font-mono-tech">
                            <div className="hidden md:flex items-center space-x-2 px-3 py-1.5 rounded-lg bg-slate-900/80 border border-slate-800">
                                <span className={`w-2 h-2 rounded-full ${emergencyHalt ? 'bg-rose-500 animate-ping' : 'bg-emerald-400 animate-pulse'}`}></span>
                                <span className="text-slate-400">STATUS:</span>
                                <span className={emergencyHalt ? 'text-rose-400 font-bold' : 'text-emerald-400 font-bold'}>
                                    {emergencyHalt ? 'HALTED' : 'NOMINAL'}
                                </span>
                            </div>

                            <div className="hidden lg:flex items-center space-x-3 text-slate-400">
                                <div><span className="text-slate-500">UTC:</span> {time.toISOString().substring(11, 19)}</div>
                                <div className="text-emerald-400"><span className="text-slate-500">LOCAL:</span> {time.toLocaleTimeString()}</div>
                            </div>

                            {/* Emergency E-Stop Trigger Button */}
                            <button
                                onClick={() => setShowEStopModal(true)}
                                className={`px-4 py-2 rounded-xl font-bold tracking-wider transition text-xs flex items-center space-x-2 border shadow-lg ${
                                    emergencyHalt 
                                        ? 'bg-rose-600 hover:bg-rose-500 text-white border-rose-400 shadow-rose-950/50' 
                                        : 'bg-rose-950/40 hover:bg-rose-900/60 text-rose-400 border-rose-500/40 hover:border-rose-500 shadow-slate-950'
                                }`}
                            >
                                <i data-lucide="octagon-alert" className="w-4 h-4"></i>
                                <span>{emergencyHalt ? 'SYSTEM HALTED' : 'E-STOP SHUTDOWN'}</span>
                            </button>
                        </div>
                    </header>

                    {/* MAIN SUB-NAVIGATION TABS */}
                    <nav className="border-b border-slate-800/80 bg-slate-900/40 px-6 flex space-x-1 sm:space-x-4 text-xs font-medium overflow-x-auto">
                        <button
                            onClick={() => setActiveTab('telemetry')}
                            className={`py-3 px-4 border-b-2 transition flex items-center space-x-2 font-mono-tech whitespace-nowrap ${
                                activeTab === 'telemetry' 
                                    ? 'border-emerald-400 text-emerald-400 font-bold bg-emerald-500/5' 
                                    : 'border-transparent text-slate-400 hover:text-slate-200'
                            }`}
                        >
                            <i data-lucide="activity" className="w-4 h-4"></i>
                            <span>TELEMETRY & COMMAND</span>
                        </button>

                        <button
                            onClick={() => setActiveTab('search')}
                            className={`py-3 px-4 border-b-2 transition flex items-center space-x-2 font-mono-tech whitespace-nowrap ${
                                activeTab === 'search' 
                                    ? 'border-emerald-400 text-emerald-400 font-bold bg-emerald-500/5' 
                                    : 'border-transparent text-slate-400 hover:text-slate-200'
                            }`}
                        >
                            <i data-lucide="search-code" className="w-4 h-4"></i>
                            <span>AI GROUNDING BRIEFING</span>
                        </button>

                        <button
                            onClick={() => setActiveTab('twin')}
                            className={`py-3 px-4 border-b-2 transition flex items-center space-x-2 font-mono-tech whitespace-nowrap ${
                                activeTab === 'twin' 
                                    ? 'border-emerald-400 text-emerald-400 font-bold bg-emerald-500/5' 
                                    : 'border-transparent text-slate-400 hover:text-slate-200'
                            }`}
                        >
                            <i data-lucide="map-pin" className="w-4 h-4"></i>
                            <span>GEOSPATIAL TWIN & DRONE HUD</span>
                        </button>

                        <button
                            onClick={() => setActiveTab('scanner')}
                            className={`py-3 px-4 border-b-2 transition flex items-center space-x-2 font-mono-tech whitespace-nowrap ${
                                activeTab === 'scanner' 
                                    ? 'border-emerald-400 text-emerald-400 font-bold bg-emerald-500/5' 
                                    : 'border-transparent text-slate-400 hover:text-slate-200'
                            }`}
                        >
                            <i data-lucide="bug" className="w-4 h-4"></i>
                            <span>PATHOLOGY SCANNER</span>
                        </button>

                        <button
                            onClick={() => setActiveTab('rules')}
                            className={`py-3 px-4 border-b-2 transition flex items-center space-x-2 font-mono-tech whitespace-nowrap ${
                                activeTab === 'rules' 
                                    ? 'border-emerald-400 text-emerald-400 font-bold bg-emerald-500/5' 
                                    : 'border-transparent text-slate-400 hover:text-slate-200'
                            }`}
                        >
                            <i data-lucide="sliders" className="w-4 h-4"></i>
                            <span>AUTOMATION ENGINE</span>
                        </button>
                    </nav>

                    {/* VIEWPORT BODY CONTAINER */}
                    <main className="flex-1 p-4 sm:p-6 max-w-7xl w-full mx-auto space-y-6">

                        {/* TAB 1: TELEMETRY & COMMAND */}
                        {activeTab === 'telemetry' && (
                            <div className="space-y-6">
                                {/* METRICS GRID */}
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                    <div className="cyber-glass p-5 rounded-2xl relative overflow-hidden group hover:border-emerald-500/50 transition">
                                        <div className="flex justify-between items-start">
                                            <span className="text-xs font-mono-tech text-slate-400 uppercase tracking-wider">Moisture Volumetric</span>
                                            <span className="px-2 py-0.5 text-[10px] font-mono-tech rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
                                                44.2% OPTIMAL
                                            </span>
                                        </div>
                                        <div className="text-3xl font-black text-slate-100 font-mono-tech mt-2">44.2 %</div>
                                        <div className="w-full bg-slate-800/80 h-1.5 rounded-full mt-3 overflow-hidden">
                                            <div className="bg-emerald-400 h-full w-[44.2%] transition-all duration-500"></div>
                                        </div>
                                        <div className="flex justify-between text-[10px] text-slate-500 font-mono-tech mt-2">
                                            <span>Target: 40-50%</span>
                                            <span>Sensor 01A</span>
                                        </div>
                                    </div>

                                    <div className="cyber-glass p-5 rounded-2xl relative overflow-hidden group hover:border-cyan-500/50 transition">
                                        <div className="flex justify-between items-start">
                                            <span className="text-xs font-mono-tech text-slate-400 uppercase tracking-wider">Soil Temp Matrix</span>
                                            <span className="px-2 py-0.5 text-[10px] font-mono-tech rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/30">
                                                26.8°C NORMAL
                                            </span>
                                        </div>
                                        <div className="text-3xl font-black text-slate-100 font-mono-tech mt-2">26.8 °C</div>
                                        <div className="w-full bg-slate-800/80 h-1.5 rounded-full mt-3 overflow-hidden">
                                            <div className="bg-cyan-400 h-full w-[58%] transition-all duration-500"></div>
                                        </div>
                                        <div className="flex justify-between text-[10px] text-slate-500 font-mono-tech mt-2">
                                            <span>Threshold: &lt;35°C</span>
                                            <span>Depth 15cm</span>
                                        </div>
                                    </div>

                                    <div className="cyber-glass p-5 rounded-2xl relative overflow-hidden group hover:border-amber-500/50 transition">
                                        <div className="flex justify-between items-start">
                                            <span className="text-xs font-mono-tech text-slate-400 uppercase tracking-wider">Rover Battery Bank</span>
                                            <span className="px-2 py-0.5 text-[10px] font-mono-tech rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/30">
                                                SOLAR CHARGING
                                            </span>
                                        </div>
                                        <div className="text-3xl font-black text-slate-100 font-mono-tech mt-2">91.4 %</div>
                                        <div className="w-full bg-slate-800/80 h-1.5 rounded-full mt-3 overflow-hidden">
                                            <div className="bg-amber-400 h-full w-[91.4%] transition-all duration-500"></div>
                                        </div>
                                        <div className="flex justify-between text-[10px] text-slate-500 font-mono-tech mt-2">
                                            <span>Est runtime: 14.2h</span>
                                            <span>Rover-01</span>
                                        </div>
                                    </div>

                                    <div className="cyber-glass p-5 rounded-2xl relative overflow-hidden group hover:border-purple-500/50 transition">
                                        <div className="flex justify-between items-start">
                                            <span className="text-xs font-mono-tech text-slate-400 uppercase tracking-wider">NPK / Soil pH</span>
                                            <span className="px-2 py-0.5 text-[10px] font-mono-tech rounded-full bg-purple-500/10 text-purple-400 border border-purple-500/30">
                                                pH 6.5 STABLE
                                            </span>
                                        </div>
                                        <div className="text-3xl font-black text-slate-100 font-mono-tech mt-2">6.5 pH</div>
                                        <div className="w-full bg-slate-800/80 h-1.5 rounded-full mt-3 overflow-hidden">
                                            <div className="bg-purple-400 h-full w-[65%] transition-all duration-500"></div>
                                        </div>
                                        <div className="flex justify-between text-[10px] text-slate-500 font-mono-tech mt-2">
                                            <span>Nitrogen: High</span>
                                            <span>Zone-A Grid</span>
                                        </div>
                                    </div>
                                </div>

                                {/* CHART & LIVE MICROCLIMATE FEED ROW */}
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    {/* Real-time Telemetry Line Chart */}
                                    <div className="lg:col-span-2 cyber-glass p-6 rounded-2xl space-y-4">
                                        <div className="flex items-center justify-between">
                                            <div>
                                                <h3 className="text-base font-bold text-slate-100 flex items-center space-x-2">
                                                    <i data-lucide="line-chart" className="w-4 h-4 text-emerald-400"></i>
                                                    <span>24-Hour Telemetry Dynamics</span>
                                                </h3>
                                                <p className="text-xs text-slate-400 font-mono-tech">Soil Moisture (%) vs Soil Temperature (°C)</p>
                                            </div>
                                            <span className="text-[10px] font-mono-tech bg-slate-900 border border-slate-800 text-emerald-400 px-2.5 py-1 rounded-lg">
                                                LIVE DYNAMIC STREAM
                                            </span>
                                        </div>

                                        <TelemetryChart />
                                    </div>

                                    {/* Weather API Feed & Actuator Toggle Panel */}
                                    <div className="space-y-6">
                                        {/* Micro-Climate Weather Integration */}
                                        <div className="cyber-glass p-6 rounded-2xl space-y-4">
                                            <div className="flex items-center justify-between border-b border-slate-800/80 pb-3">
                                                <h3 className="text-sm font-bold text-slate-200 flex items-center space-x-2">
                                                    <i data-lucide="cloud-sun" className="w-4 h-4 text-cyan-400"></i>
                                                    <span>Live Micro-Climate (Chennai)</span>
                                                </h3>
                                                <span className="text-[10px] font-mono-tech text-cyan-400 bg-cyan-500/10 px-2 py-0.5 rounded border border-cyan-500/20">OpenWeather</span>
                                            </div>

                                            {!weatherLoading && weather && weather.main ? (
                                                <div className="grid grid-cols-2 gap-3 text-xs font-mono-tech">
                                                    <div className="bg-slate-950/60 p-3 rounded-xl border border-slate-800">
                                                        <div className="text-slate-400">Air Temp</div>
                                                        <div className="text-lg font-bold text-sky-400 mt-1">{weather.main.temp} °C</div>
                                                    </div>
                                                    <div className="bg-slate-950/60 p-3 rounded-xl border border-slate-800">
                                                        <div className="text-slate-400">Humidity</div>
                                                        <div className="text-lg font-bold text-teal-400 mt-1">{weather.main.humidity} %</div>
                                                    </div>
                                                    <div className="bg-slate-950/60 p-3 rounded-xl border border-slate-800">
                                                        <div className="text-slate-400">Wind Velocity</div>
                                                        <div className="text-lg font-bold text-emerald-400 mt-1">{weather.wind?.speed} m/s</div>
                                                    </div>
                                                    <div className="bg-slate-950/60 p-3 rounded-xl border border-slate-800">
                                                        <div className="text-slate-400">Condition</div>
                                                        <div className="text-xs font-semibold text-indigo-300 mt-1 capitalize truncate">{weather.weather[0]?.description}</div>
                                                    </div>
                                                </div>
                                            ) : (
                                                <div className="text-xs text-slate-400 py-6 text-center font-mono-tech animate-pulse">
                                                    Establishing telemetry connection to satellite feed...
                                                </div>
                                            )}
                                        </div>

                                        {/* Closed-Loop Actuator Switches */}
                                        <div className="cyber-glass p-6 rounded-2xl space-y-4">
                                            <h3 className="text-sm font-bold text-slate-200 flex items-center space-x-2 border-b border-slate-800/80 pb-3">
                                                <i data-lucide="toggle-left" className="w-4 h-4 text-emerald-400"></i>

                        {/* TAB 2: AI GROUNDING BRIEFING */}

                                </form>

                                {searchResult && (

                        {/* TAB 3: GEOSPATIAL TWIN & DRONE HUD */}
                        {activeTab === 'twin' && (

                                        <div>
                                            <h3 className="text-base font-bold text-slate-100 flex items-center space-x-2">

                                                <span>Interactive Farm Zone Geospatial Twin</span>
                                            </h3>
                                            <p className="text-xs text-slate-400 font-mono-tech">Click field zones to inspect live NDVI vegetation health index</p>
                                        </div>
                                        <span className="text-[10px] font-mono-tech text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded border border-emerald-500/20">

                                    </div>

                                    {/* SVG Map Representation */}

                                        <svg className="w-full h-full p-4" viewBox="0 0 400 200">
                                            <defs>
                                                <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                                                    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" strokeWidth="0.5"/>
                                                </pattern>
                                            </defs>
                                            <rect width="100%" height="100%" fill="url(#grid)" />

                                            {/* Zone A Polygon */}
                                            <g onClick={() => setSelectedZone('Zone-A')} className="cursor-pointer group">
                                                <polygon points="20,20 180,20 160,90 30,90" 
                                                    className={`transition ${selectedZone === 'Zone-A' ? 'fill-emerald-500/30 stroke-emerald-400' : 'fill-emerald-950/40 stroke-emerald-600/50'} stroke-2 group-hover:fill-emerald-500/20`}
                                                />

                                            {/* Zone B Polygon */}

                                            <span className="text-slate-400">HEALTH INDEX: </span>

                                <div className="cyber-glass p-6 rounded-2xl space-y-4">
                                    <div className="flex justify-between items-center border-b border-slate-800/80 pb-3">
                                        <h3 className="text-sm font-bold text-slate-200 flex items-center space-x-2">
                                            <i data-lucide="plane" className="w-4 h-4 text-cyan-400"></i>

                                                    <span>Aphid Cluster (Zone B)</span>

                                                </div>
                                                <div className="flex justify-between p-2.5 bg-slate-900/60 rounded-lg border border-slate-800">
                                                    <span>Early Blight (Zone C)</span>
                                                    <span className="text-amber-400">ACTION REQUIRED</span>

                                        </div>

                                        <div className="text-[10px] text-slate-500 font-mono-tech text-center border-t border-slate-800 pt-3">

                        )}

                        {/* TAB 5: AUTOMATION ENGINE */}
                        {activeTab === 'rules' && (
                            <div className="cyber-glass p-6 rounded-2xl space-y-6">
                                <div className="border-b border-slate-800/80 pb-4">
                                    <h3 className="text-lg font-bold text-slate-100 flex items-center space-x-2">
                                        <i data-lucide="cpu" className="w-5 h-5 text-cyan-400"></i>
                                        <span>Autonomous Rules & Trigger Rules Engine</span>
                                    </h3>
                                    <p className="text-xs text-slate-400 font-mono-tech mt-1">
                                        Configure automatic actuator trigger conditions based on live telemetry thresholds.
                                    </p>
                                </div>

                                <div className="space-y-3">
                                    {rules.map(rule => (
                                        <div key={rule.id} className="p-4 bg-slate-950/80 rounded-xl border border-slate-800 flex flex-wrap items-center justify-between gap-4">
                                            <div>
                                                <div className="text-sm font-bold text-slate-200">{rule.name}</div>
                                                <div className="text-xs font-mono-tech text-slate-400 mt-1">
                                                    IF <span className="text-amber-400">{rule.condition}</span> THEN <span className="text-emerald-400">{rule.action}</span>
                                                </div>
                                            </div>

                                            <button 
                                                onClick={() => {
                                                    setRules(rules.map(r => r.id === rule.id ? { ...r, active: !r.active } : r));
                                                }}
                                                className={`px-3 py-1.5 rounded-lg text-xs font-mono-tech font-bold transition border ${
                                                    rule.active 
                                                        ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' 
                                                        : 'bg-slate-800 text-slate-500 border-slate-700'
                                                }`}
                                            >
                                                {rule.active ? 'TRIGGER ENABLED' : 'DISABLED'}
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                    </main>

                    {/* MODAL E-STOP CONFIRMATION */}
                    {showEStopModal && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="cyber-glass p-6 rounded-2xl max-w-md w-full border-rose-500/50 space-y-4">
                                <div className="flex items-center space-x-3 text-rose-400">
                                    <i data-lucide="triangle-alert" className="w-6 h-6"></i>
                                    <h3 className="text-lg font-bold font-mono-tech">CONFIRM EMERGENCY E-STOP</h3>
                                </div>
                                <p className="text-xs text-slate-300">
                                    This will immediately send a hard halt command to all agricultural rovers, close all drip irrigation solenoids, and cut high-voltage fogger arrays.
                                </p>
                                <div className="flex justify-end space-x-3 pt-2">
                                    <button 
                                        onClick={() => setShowEStopModal(false)}
                                        className="px-4 py-2 bg-slate-800 text-slate-300 text-xs font-mono-tech rounded-xl hover:bg-slate-700"
                                    >
                                        CANCEL
                                    </button>
                                    <button 
                                        onClick={confirmEmergencyStop}
                                        className="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs font-mono-tech rounded-xl"
                                    >
                                        EXECUTE SHUTDOWN
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        // Separate Chart Component using Chart.js
        function TelemetryChart() {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (!chartRef.current) return;

                const ctx = chartRef.current.getContext('2d');

                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                chartInstance.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: ['00:00', '04:00', '08:00', '12:00', '16:00', '20:00', '24:00'],
                        datasets: [
                            {
                                label: 'Soil Moisture (%)',
                                data: [42, 41, 39, 45, 48, 44, 44.2],
                                borderColor: '#10b981',
                                backgroundColor: 'rgba(16, 185, 129, 0.1)',
                                fill: true,
                                tension: 0.4
                            },
                            {
                                label: 'Soil Temperature (°C)',
                                data: [22, 21, 24, 29, 31, 28, 26.8],
                                borderColor: '#06b6d4',
                                backgroundColor: 'transparent',
                                borderDash: [5, 5],
                                tension: 0.4
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                labels: { color: '#94a3b8', font: { family: 'JetBrains Mono', size: 11 } }
                            }
                        },
                        scales: {
                            x: {
                                grid: { color: 'rgba(30, 41, 59, 0.5)' },
                                ticks: { color: '#64748b', font: { family: 'JetBrains Mono', size: 10 } }
                            },
                            y: {
                                grid: { color: 'rgba(30, 41, 59, 0.5)' },
                                ticks: { color: '#64748b', font: { family: 'JetBrains Mono', size: 10 } }
                            }
                        }
                    }
                });

                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                };
            }, []);

            return (
                <div className="w-full h-64">
                    <canvas ref={chartRef}></canvas>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
