<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriVision AI — Autonomous Farm Command Center</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React, React-DOM & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* Custom scrollbar for dark tech theme */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #020617;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-emerald-500 selection:text-white min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            // State Management
            const [weather, setWeather] = React.useState(null);
            const [weatherLoading, setWeatherLoading] = React.useState(true);
            const [query, setQuery] = React.useState('');
            const [aiResponse, setAiResponse] = React.useState('');
            const [loading, setLoading] = React.useState(false);
            const [activeTab, setActiveTab] = React.useState('overview');

            // Interactive Controls
            const [autoIrrigation, setAutoIrrigation] = React.useState(true);
            const [roverStatus, setRoverStatus] = React.useState('AUTONOMOUS_PATROL');
            const [emergencyStop, setEmergencyStop] = React.useState(false);

            // OpenWeather API Key
            const OPENWEATHER_KEY = '1bd24c09f5d8675f2e77a3366efb85f4';

            // Fetch Weather on Mount
            React.useEffect(() => {
                setWeatherLoading(true);
                fetch(`https://api.openweathermap.org/data/2.5/weather?q=Chennai&units=metric&appid=${OPENWEATHER_KEY}`)
                    .then(res => res.json())
                    .then(data => {
                        setWeather(data);
                        setWeatherLoading(false);
                    })
                    .catch(err => {
                        console.error('Weather fetch error:', err);
                        setWeatherLoading(false);
                    });
            }, []);

            // Emergency Stop Toggle Handler
            const toggleEmergencyStop = () => {
                const nextState = !emergencyStop;
                setEmergencyStop(nextState);
                if (nextState) {
                    setRoverStatus('EMERGENCY_HALT');
                } else {
                    setRoverStatus('AUTONOMOUS_PATROL');
                }
            };

            // Keyless Search via Wikipedia Search + Summary APIs (CORS Enabled with origin=*)
            const handleAIAnalyze = async (e) => {
                e.preventDefault();
                if (!query.trim()) return;
                setLoading(true);
                setAiResponse('');

                let resultSummary = null;
                let resultTitle = "";

                try {
                    // Step 1: Query Wikipedia Search API for top matching article
                    const searchRes = await fetch(
                        `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query + " agriculture")}&format=json&origin=*`
                    );
                    const searchData = await searchRes.json();

                    if (searchData.query?.search?.length > 0) {
                        const topResult = searchData.query.search[0];
                        resultTitle = topResult.title;

                        // Step 2: Fetch detailed summary extract for top result
                        const summaryRes = await fetch(
                            `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(resultTitle)}`
                        );
                        
                        if (summaryRes.ok) {
                            const summaryData = await summaryRes.json();
                            resultSummary = summaryData.extract;
                        }
                    }
                } catch (err) {
                    console.warn("Wikipedia API search failed:", err);
                }

                // Format Briefing Response
                if (resultSummary) {
                    setAiResponse(
                        `🌐 **Live Web Briefing: ${resultTitle}**\n\n` +
                        `• ${resultSummary}\n\n` +
                        `*Source: Public Web Knowledge Graph (Zero-API Key Telemetry)*`
                    );
                } else {
                    setAiResponse(
                        `🌾 **AgriVision Search Advisory**:\n\n` +
                        `• No direct web summary retrieved for "${query}". Try refining your agricultural topic (e.g., "Photosynthesis", "Nitrogen Cycle", or "Drip Irrigation").`
                    );
                }

                setLoading(false);
            };

            return (
                <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
                    {/* Header Command Bar */}
                    <header className="border-b border-slate-800 bg-slate-900/90 backdrop-blur-md sticky top-0 z-50 px-6 py-4 flex flex-wrap justify-between items-center gap-4">
                        <div className="flex items-center space-x-3">
                            <div className="p-2.5 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-emerald-400">
                                🛸
                            </div>
                            <div>
                                <h1 className="text-xl font-bold bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-200 bg-clip-text text-transparent">
                                    AgriVision AI
                                </h1>
                                <p className="text-xs text-slate-400">Autonomous Precision Farming & Live Web Intelligence</p>
                            </div>
                        </div>

                        <div className="flex items-center space-x-3">
                            {/* Emergency E-Stop Button */}
                            <button 
                                onClick={toggleEmergencyStop}
                                className={`px-4 py-2 rounded-xl text-xs font-bold tracking-wide transition shadow-lg ${
                                    emergencyStop 
                                        ? 'bg-rose-600 hover:bg-rose-700 text-white animate-pulse shadow-rose-900/50' 
                                        : 'bg-slate-900 border border-rose-500/40 hover:border-rose-500 hover:bg-rose-950/30 text-rose-400'
                                }`}
                            >
                                {emergencyStop ? '🚨 EMERGENCY HALT ACTIVE' : '🛑 E-STOP SHUTDOWN'}
                            </button>

                            {/* Rover Telemetry Status Indicator */}
                            <div className="flex items-center space-x-2 bg-slate-900 border border-slate-800 px-3 py-2 rounded-xl text-xs text-slate-300">
                                <span className={`w-2 h-2 rounded-full ${emergencyStop ? 'bg-rose-500' : 'bg-emerald-400 animate-ping'}`}></span>
                                <span>Rover 01: <strong className={emergencyStop ? 'text-rose-400' : 'text-emerald-400'}>{roverStatus}</strong></span>
                            </div>
                        </div>
                    </header>

                    {/* Navigation Tabs */}
                    <nav className="border-b border-slate-800 bg-slate-900/40 px-6 flex space-x-6 text-sm font-medium">
                        <button 
                            onClick={() => setActiveTab('overview')} 
                            className={`py-3.5 border-b-2 transition flex items-center gap-2 ${activeTab === 'overview' ? 'border-emerald-400 text-emerald-400 font-semibold' : 'border-transparent text-slate-400 hover:text-slate-200'}`}
                        >
                            📊 Command Telemetry
                        </button>
                        <button 
                            onClick={() => setActiveTab('ai')} 
                            className={`py-3.5 border-b-2 transition flex items-center gap-2 ${activeTab === 'ai' ? 'border-emerald-400 text-emerald-400 font-semibold' : 'border-transparent text-slate-400 hover:text-slate-200'}`}
                        >
                            🔍 Keyless Web Search Advisor
                        </button>
                        <button 
                            onClick={() => setActiveTab('heatmap')} 
                            className={`py-3.5 border-b-2 transition flex items-center gap-2 ${activeTab === 'heatmap' ? 'border-emerald-400 text-emerald-400 font-semibold' : 'border-transparent text-slate-400 hover:text-slate-200'}`}
                        >
                            🗺️ Heatmap & Digital Twin
                        </button>
                    </nav>

                    {/* Main Content Body */}
                    <main className="flex-1 p-6 max-w-7xl w-full mx-auto space-y-6">
                        
                        {/* TAB 1: OVERVIEW & TELEMETRY */}
                        {activeTab === 'overview' && (
                            <div className="space-y-6">
                                {/* Interactive Sensor Telemetry Cards */}
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                    <div className="bg-slate-900/80 border border-slate-800 p-5 rounded-2xl shadow-xl hover:border-emerald-500/30 transition">
                                        <div className="flex justify-between items-start">
                                            <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Soil Moisture</span>
                                            <span className="text-xs px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Optimal</span>
                                        </div>
                                        <div className="text-3xl font-extrabold text-slate-100 mt-2">44.2 %</div>
                                        <div className="w-full bg-slate-800 h-1.5 rounded-full mt-3 overflow-hidden">
                                            <div className="bg-emerald-400 h-full w-[44%]"></div>
                                        </div>
                                    </div>

                                    <div className="bg-slate-900/80 border border-slate-800 p-5 rounded-2xl shadow-xl hover:border-amber-500/30 transition">
                                        <div className="flex justify-between items-start">
                                            <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Soil Temperature</span>
                                            <span className="text-xs px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20">Normal</span>
                                        </div>
                                        <div className="text-3xl font-extrabold text-slate-100 mt-2">26.8 °C</div>
                                        <div className="w-full bg-slate-800 h-1.5 rounded-full mt-3 overflow-hidden">
                                            <div className="bg-amber-400 h-full w-[58%]"></div>
                                        </div>
                                    </div>

                                    <div className="bg-slate-900/80 border border-slate-800 p-5 rounded-2xl shadow-xl hover:border-blue-500/30 transition">
                                        <div className="flex justify-between items-start">
                                            <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Rover Battery</span>
                                            <span className="text-xs px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20">Charging</span>
                                        </div>
                                        <div className="text-3xl font-extrabold text-slate-100 mt-2">91 %</div>
                                        <div className="w-full bg-slate-800 h-1.5 rounded-full mt-3 overflow-hidden">
                                            <div className="bg-blue-400 h-full w-[91%]"></div>
                                        </div>
                                    </div>

                                    <div className="bg-slate-900/80 border border-slate-800 p-5 rounded-2xl shadow-xl hover:border-violet-500/30 transition">
                                        <div className="flex justify-between items-start">
                                            <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Soil pH Level</span>
                                            <span className="text-xs px-2 py-0.5 rounded-full bg-violet-500/10 text-violet-400 border border-violet-500/20">pH 6.5</span>
                                        </div>
                                        <div className="text-3xl font-extrabold text-slate-100 mt-2">Balanced</div>
                                        <div className="w-full bg-slate-800 h-1.5 rounded-full mt-3 overflow-hidden">
                                            <div className="bg-violet-400 h-full w-[65%]"></div>
                                        </div>
                                    </div>
                                </div>

                                {/* Weather Stream & Automated Control Row */}
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    <div className="lg:col-span-2 bg-slate-900/80 border border-slate-800 p-6 rounded-2xl shadow-xl">
                                        <div className="flex justify-between items-center mb-4">
                                            <h3 className="text-base font-semibold text-slate-200 flex items-center gap-2">
                                                <span>🌤️</span> Live Micro-Climate Feed (Chennai, India)
                                            </h3>
                                            <span className="text-xs font-mono text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">OpenWeather Live</span>
                                        </div>

                                        {!weatherLoading && weather && weather.main ? (
                                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                                                <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                                    <div className="text-xs text-slate-400">Temperature</div>
                                                    <div className="text-xl font-bold text-sky-400 mt-1">{weather.main.temp} °C</div>
                                                </div>
                                                <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                                    <div className="text-xs text-slate-400">Humidity</div>
                                                    <div className="text-xl font-bold text-teal-400 mt-1">{weather.main.humidity} %</div>
                                                </div>
                                                <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                                    <div className="text-xs text-slate-400">Wind Speed</div>
                                                    <div className="text-xl font-bold text-emerald-400 mt-1">{weather.wind?.speed} m/s</div>
                                                </div>
                                                <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                                    <div className="text-xs text-slate-400">Conditions</div>
                                                    <div className="text-sm font-semibold text-indigo-300 mt-1 capitalize">{weather.weather[0].description}</div>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="text-slate-400 text-sm py-6 text-center animate-pulse">
                                                Connecting to OpenWeather live telemetry stream...
                                            </div>
                                        )}
                                    </div>

                                    <div className="bg-slate-900/80 border border-slate-800 p-6 rounded-2xl shadow-xl flex flex-col justify-between">
                                        <div>
                                            <h3 className="text-base font-semibold text-slate-200 mb-1">💧 Drip Irrigation Loop</h3>
                                            <p className="text-xs text-slate-400 mb-4">Automatically triggers targeted zone valves when moisture drops below 35%.</p>
                                        </div>
                                        <div className="flex items-center justify-between p-4 bg-slate-950 rounded-xl border border-slate-800">
                                            <span className="text-sm font-medium text-slate-300">Automated Drip Status</span>
                                            <button 
                                                onClick={() => setAutoIrrigation(!autoIrrigation)}
                                                className={`px-4 py-2 rounded-lg text-xs font-bold transition ${
                                                    autoIrrigation 
                                                        ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' 
                                                        : 'bg-slate-800 text-slate-400 border border-slate-700'
                                                }`}
                                            >
                                                {autoIrrigation ? 'ENABLED' : 'MANUAL OVERRIDE'}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 2: KEYLESS SEARCH ADVISOR */}
                        {activeTab === 'ai' && (
                            <div className="bg-slate-900/80 border border-slate-800 rounded-2xl shadow-xl p-6 space-y-6">
                                <div className="border-b border-slate-800 pb-4">
                                    <h3 className="text-lg font-semibold text-slate-100 flex items-center gap-2">
                                        <span>🔍</span> Keyless Web Search & Agricultural Advisor
                                    </h3>
                                    <p className="text-xs text-slate-400">
                                        Searches live public knowledge endpoints in the background and compiles instant summaries—no API key required.
                                    </p>
                                </div>

                                <form onSubmit={handleAIAnalyze} className="space-y-4">
                                    <textarea
                                        rows="4"
                                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-slate-200 placeholder-slate-500 focus:ring-2 focus:ring-emerald-500/50 outline-none transition text-sm"
                                        placeholder="Type an agricultural query (e.g., Photosynthesis, Tomato Blight, Nitrogen Fertilizer)..."
                                        value={query}
                                        onChange={(e) => setQuery(e.target.value)}
                                    />

                                    {/* Action Button Row */}
                                    <div className="flex flex-wrap items-center justify-end gap-3">
                                        {/* DuckDuckGo External Backup Search Button */}
                                        <button
                                            type="button"
                                            onClick={() => {
                                                if (!query.trim()) return;
                                                window.open(`https://duckduckgo.com/?q=${encodeURIComponent(query + " agriculture")}`, '_blank');
                                            }}
                                            className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-medium text-sm px-4 py-2.5 rounded-xl transition flex items-center gap-2"
                                        >
                                            <span>🦆</span> Search DuckDuckGo (New Tab)
                                        </button>

                                        {/* Main Web Search & Briefing Button */}
                                        <button
                                            type="submit"
                                            disabled={loading}
                                            className="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-semibold text-sm px-6 py-2.5 rounded-xl transition shadow-lg shadow-emerald-950/50 disabled:opacity-50"
                                        >
                                            {loading ? 'Searching Web Telemetry...' : '🚀 Search & Generate Brief'}
                                        </button>
                                    </div>
                                </form>

                                {aiResponse && (
                                    <div className="bg-slate-950 border border-emerald-500/30 rounded-xl p-5 space-y-3">
                                        <div className="flex justify-between items-center text-xs font-semibold text-emerald-400 border-b border-slate-800 pb-2">
                                            <span>AgriVision Intelligence Report</span>
                                            <span className="font-mono bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">Zero-API Mode</span>
                                        </div>
                                        <p className="text-slate-200 text-sm leading-relaxed whitespace-pre-wrap">{aiResponse}</p>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* TAB 3: HEATMAP & DIGITAL TWIN */}
                        {activeTab === 'heatmap' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                <div className="lg:col-span-2 bg-slate-900/80 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-4">
                                    <div className="flex justify-between items-center">
                                        <h3 className="text-base font-semibold text-slate-200">🗺️ Crop Health Digital Twin Heatmap</h3>
                                        <span className="text-xs text-slate-400">Drone Patrol #1080</span>
                                    </div>

                                    {/* Zone Health Indicators */}
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 p-4 bg-slate-950 rounded-xl border border-slate-800">
                                        <div className="bg-emerald-500/10 border border-emerald-500/30 p-6 rounded-xl text-center">
                                            <div className="text-emerald-400 font-bold text-sm">Zone A (Optimal)</div>
                                            <div className="text-slate-400 text-xs mt-1">NDVI Index: 0.88</div>
                                        </div>
                                        <div className="bg-amber-500/10 border border-amber-500/30 p-6 rounded-xl text-center">
                                            <div className="text-amber-400 font-bold text-sm">Zone B (Water Stress)</div>
                                            <div className="text-slate-400 text-xs mt-1">NDVI Index: 0.52</div>
                                        </div>
                                        <div className="bg-rose-500/10 border border-rose-500/30 p-6 rounded-xl text-center">
                                            <div className="text-rose-400 font-bold text-sm">Zone C (Pest Alert)</div>
                                            <div className="text-slate-400 text-xs mt-1">NDVI Index: 0.31</div>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-slate-900/80 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-4 flex flex-col justify-between">
                                    <div>
                                        <h3 className="text-base font-semibold text-slate-200 mb-2">📹 Aerial Inspection Video Stream</h3>
                                        <div className="w-full h-48 bg-slate-950 rounded-xl border border-slate-800 flex items-center justify-center relative overflow-hidden">
                                            <div className="text-center z-10">
                                                <span className="text-3xl">🚁</span>
                                                <p className="text-xs text-emerald-400 mt-2 font-mono">LIVE DRONE FEED ACTIVE</p>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="text-xs text-slate-400 bg-slate-950 p-3 rounded-xl border border-slate-800">
                                        GPS Telemetry: 13.0827° N, 80.2707° E
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
`
