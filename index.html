<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriVision AI — Smart Farm Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [weather, setWeather] = React.useState(null);
            const [query, setQuery] = React.useState('');
            const [aiResponse, setAiResponse] = React.useState('');
            const [loading, setLoading] = React.useState(false);
            const [activeTab, setActiveTab] = React.useState('dashboard');

            // API Keys
            const OPENWEATHER_KEY = '1bd24c09f5d8675f2e77a3366efb85f4';
            const GEMINI_KEY = 'AIzaSyYourActualGeminiApiKeyHere'; // <--- PASTE YOUR AIzaSy... KEY HERE

            // Fetch Live Weather on Load
            React.useEffect(() => {
                fetch(`https://api.openweathermap.org/data/2.5/weather?q=Chennai&units=metric&appid=${OPENWEATHER_KEY}`)
                    .then(res => res.json())
                    .then(data => setWeather(data))
                    .catch(err => console.error('Weather fetch error:', err));
            }, []);

            // Handle Gemini AI Request
            const handleAIAnalyze = async (e) => {
                e.preventDefault();
                if (!query.trim()) return;
                setLoading(true);
                setAiResponse('');

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{
                                    text: `You are AgriVision AI, an expert agricultural assistant managing drone monitoring, closed-loop crop care, soil analytics, pest symptom detection, and precision irrigation. Provide clear, actionable advice for: ${query}`
                                }]
                            }]
                        })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error?.message || 'API request failed');
                    }

                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response generated.';
                    setAiResponse(text);
                } catch (err) {
                    console.error('Gemini error:', err);
                    setAiResponse(`Error connecting to Gemini AI: ${err.message}`);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <header className="bg-emerald-800 text-white shadow-md py-4 px-6 flex justify-between items-center">
                        <div className="flex items-center space-x-2">
                            <span className="text-2xl">🌱</span>
                            <h1 className="text-xl font-bold">AgriVision AI Farm Command Center</h1>
                        </div>
                        <div className="text-sm bg-emerald-700 px-3 py-1 rounded-full">
                            Status: <span className="text-emerald-300 font-semibold">Autonomous System Active</span>
                        </div>
                    </header>

                    {/* Navigation Tabs */}
                    <nav className="bg-white border-b px-6 flex space-x-4">
                        <button onClick={() => setActiveTab('dashboard')} className={`py-3 font-medium border-b-2 ${activeTab === 'dashboard' ? 'border-emerald-600 text-emerald-600' : 'border-transparent text-slate-500'}`}>Dashboard & Weather</button>
                        <button onClick={() => setActiveTab('ai')} className={`py-3 font-medium border-b-2 ${activeTab === 'ai' ? 'border-emerald-600 text-emerald-600' : 'border-transparent text-slate-500'}`}>Gemini AI Crop Advisor</button>
                        <button onClick={() => setActiveTab('drone')} className={`py-3 font-medium border-b-2 ${activeTab === 'drone' ? 'border-emerald-600 text-emerald-600' : 'border-transparent text-slate-500'}`}>Drone & Heatmap</button>
                    </nav>

                    {/* Main Content */}
                    <main className="flex-1 p-6 max-w-6xl w-full mx-auto">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-6">
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                    <div className="bg-white p-4 rounded-lg shadow border">
                                        <h3 className="text-sm text-slate-500 font-medium">Soil Moisture</h3>
                                        <p className="text-2xl font-bold text-emerald-600 mt-1">42% (Optimal)</p>
                                    </div>
                                    <div className="bg-white p-4 rounded-lg shadow border">
                                        <h3 className="text-sm text-slate-500 font-medium">Soil Temperature</h3>
                                        <p className="text-2xl font-bold text-amber-600 mt-1">26.4 °C</p>
                                    </div>
                                    <div className="bg-white p-4 rounded-lg shadow border">
                                        <h3 className="text-sm text-slate-500 font-medium">Battery Level (Rover)</h3>
                                        <p className="text-2xl font-bold text-blue-600 mt-1">88%</p>
                                    </div>
                                    <div className="bg-white p-4 rounded-lg shadow border">
                                        <h3 className="text-sm text-slate-500 font-medium">System Health</h3>
                                        <p className="text-2xl font-bold text-emerald-600 mt-1">99.8%</p>
                                    </div>
                                </div>

                                {/* Weather Widget */}
                                <div className="bg-sky-50 border border-sky-200 rounded-lg p-6">
                                    <h3 className="text-lg font-semibold text-sky-900 mb-2">🌤️ Live Farm Weather (OpenWeather API)</h3>
                                    {weather && weather.main ? (
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 text-sky-950">
                                            <div><strong>Location:</strong> {weather.name}</div>
                                            <div><strong>Temperature:</strong> {weather.main.temp} °C</div>
                                            <div><strong>Condition:</strong> {weather.weather[0].description}</div>
                                            <div><strong>Humidity:</strong> {weather.main.humidity}%</div>
                                        </div>
                                    ) : (
                                        <p className="text-sky-700">Connecting to OpenWeather API...</p>
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === 'ai' && (
                            <div className="bg-white rounded-lg shadow border p-6">
                                <h3 className="text-lg font-semibold text-slate-800 mb-4">🤖 Gemini AI Crop Health & Disease Diagnostician</h3>
                                <form onSubmit={handleAIAnalyze} className="space-y-4">
                                    <textarea
                                        rows="4"
                                        className="w-full border rounded-lg p-3 focus:ring-2 focus:ring-emerald-500 outline-none"
                                        placeholder="Describe crop symptoms, pest issues, or soil moisture concerns..."
                                        value={query}
                                        onChange={(e) => setQuery(e.target.value)}
                                    />
                                    <button
                                        type="submit"
                                        disabled={loading}
                                        className="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-6 py-2 rounded-lg transition"
                                    >
                                        {loading ? 'Analyzing with Gemini AI...' : 'Generate AI Action Plan'}
                                    </button>
                                </form>

                                {aiResponse && (
                                    <div className="mt-6 bg-emerald-50 border border-emerald-200 rounded-lg p-4">
                                        <h4 className="font-semibold text-emerald-900 mb-2">AgriVision AI Recommendations:</h4>
                                        <p className="text-emerald-950 whitespace-pre-wrap">{aiResponse}</p>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'drone' && (
                            <div className="space-y-6">
                                <div className="bg-white rounded-lg shadow border p-6">
                                    <h3 className="text-lg font-semibold text-slate-800 mb-3">🚁 Crop Health Heatmap & Drone Monitoring</h3>
                                    <div className="grid grid-cols-3 gap-4 text-center">
                                        <div className="bg-emerald-100 border border-emerald-300 p-4 rounded-lg">
                                            <div className="font-bold text-emerald-800 text-lg">Zone A (Green)</div>
                                            <div className="text-emerald-600 text-sm">Healthy Crops (78%)</div>
                                        </div>
                                        <div className="bg-amber-100 border border-amber-300 p-4 rounded-lg">
                                            <div className="font-bold text-amber-800 text-lg">Zone B (Yellow)</div>
                                            <div className="text-amber-600 text-sm">Nutrient Stress (15%)</div>
                                        </div>
                                        <div className="bg-rose-100 border border-rose-300 p-4 rounded-lg">
                                            <div className="font-bold text-rose-800 text-lg">Zone C (Red)</div>
                                            <div className="text-rose-600 text-sm">Immediate Action Required (7%)</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
